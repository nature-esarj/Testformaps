<html>

    const exportMainTitle = "Saved Layers";
    const exportMainTitleExclusive = false;
    const exportShowLegend = true;
    const exportShowScale = true;
    const rulerMeasurementDisplay = document.getElementById('rulerMeasurementDisplay');
    const exportMapLegendPanel = document.getElementById('exportMapLegendPanel');
    const exportMapScaleBarPanel = document.getElementById('exportMapScaleBarPanel');
    const exportLayerControlElement = document.getElementById('exportLayerControl');
    const exportLayerControlTitle = document.getElementById('exportLayerControlTitle');
    const exportLayerList = document.getElementById('exportLayerList');
    const exportMobileControls = document.getElementById('exportMobileControls');
    const exportMobileFab = document.getElementById('exportMobileFab');
    const exportMobileFabPanel = document.getElementById('exportMobileFabPanel');
    const exportToggleLayersBtn = document.getElementById('exportToggleLayers');
    const exportToggleLegendBtn = document.getElementById('exportToggleLegend');
    const exportToggleScaleBtn = document.getElementById('exportToggleScale');
    const exportedLayersById = new Map(exportedLayers.map((item) => [item.id, item]));
    const MAIN_TITLE_GROUP_ID = '__main__';
    const RULER_SOURCE_ID = 'ruler-source';
    const RULER_LINE_LAYER_ID = 'ruler-line';
    const RULER_POINT_LAYER_ID = 'ruler-points';
    const rulerPoints = [];
    const exportMovedElements = [];
    const exportScaleBarControl = new maplibregl.ScaleControl({
      maxWidth: 160,
      unit: 'metric'
    });
    const exportPrimaryStyle = "https://tiles.openfreemap.org/styles/bright";
    let isExportMobileLayoutActive = false;
    let isExportScaleBarControlAttached = false;
    let isExportScaleTemporarilyHidden = false;
    let hasExportStyleLoaded = false;
    let exportMapClickHandlerBound = false;
    let isRulerActive = false;
    let rulerButton = null;

    const map = new maplibregl.Map({
      container: 'map',
      style: exportPrimaryStyle,
      center: [9.77792527353904,52.41511973951884],
      zoom: 9.8417,
      bearing: 0,
      pitch: 0,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: false,
      showUserHeading: true
    }), 'top-right');

    const exportLayerControlPlugin = {
      onAdd() {
        exportLayerControlElement.classList.add('maplibregl-ctrl');
        exportLayerControlElement.addEventListener('mousedown', (event) => event.stopPropagation());
        exportLayerControlElement.addEventListener('pointerdown', (event) => event.stopPropagation());
        exportLayerControlElement.addEventListener('touchstart', (event) => event.stopPropagation(), { passive: true });
        exportLayerControlElement.addEventListener('dblclick', (event) => event.stopPropagation());
        return exportLayerControlElement;
      },
      onRemove() {
        exportLayerControlElement.classList.remove('maplibregl-ctrl');
        if (exportLayerControlElement.parentNode) {
          exportLayerControlElement.parentNode.removeChild(exportLayerControlElement);
        }
      }
    };

    map.addControl(exportLayerControlPlugin, 'bottom-left');

    function moveElementIntoExportMap(el) {
      if (!el) {
        return;
      }

      const mapEl = document.getElementById('map');
      if (!mapEl) {
        return;
      }

      if (el.parentNode === mapEl) {
        return;
      }

      exportMovedElements.push({ el, parent: el.parentNode, nextSibling: el.nextSibling });
      mapEl.appendChild(el);
    }

    function restoreMovedExportElements() {
      for (let index = exportMovedElements.length - 1; index >= 0; index -= 1) {
        const entry = exportMovedElements[index];
        try {
          if (!entry.parent) {
            continue;
          }

          if (entry.nextSibling && entry.nextSibling.parentNode === entry.parent) {
            entry.parent.insertBefore(entry.el, entry.nextSibling);
          } else {
            entry.parent.appendChild(entry.el);
          }
        } catch (error) {
        }
      }

      exportMovedElements.length = 0;
    }

    function setExportFabExpanded(nextExpanded) {
      if (!exportMobileFab) {
        return;
      }

      exportMobileFab.setAttribute('aria-expanded', nextExpanded ? 'true' : 'false');
    }

    function setExportLayerSheetOpen(nextOpen) {
      if (!exportLayerControlElement) {
        return;
      }

      exportLayerControlElement.classList.toggle('is-open', Boolean(nextOpen));
    }

    function setExportLegendSheetOpen(nextOpen) {
      if (!exportMapLegendPanel || !exportShowLegend) {
        return;
      }

      exportMapLegendPanel.classList.toggle('is-open', Boolean(nextOpen));
    }

    function closeExportBottomSheets() {
      setExportLayerSheetOpen(false);
      setExportLegendSheetOpen(false);
    }

    function syncExportMobileActionButtons() {
      if (exportToggleLegendBtn) {
        exportToggleLegendBtn.style.display = exportShowLegend ? '' : 'none';
      }

      if (exportToggleScaleBtn) {
        exportToggleScaleBtn.style.display = exportShowScale ? '' : 'none';
      }
    }

    function renderExportScalePanel() {
      if (!exportMapScaleBarPanel || !exportShowScale) {
        if (exportMapScaleBarPanel) {
          exportMapScaleBarPanel.style.display = 'none';
        }
        return;
      }

      if (!isExportScaleBarControlAttached) {
        const scaleElement = exportScaleBarControl.onAdd(map);
        exportMapScaleBarPanel.innerHTML = '';
        exportMapScaleBarPanel.appendChild(scaleElement);
        isExportScaleBarControlAttached = true;
      }

      const shouldHideScale = isExportMobileLayoutActive && isExportScaleTemporarilyHidden;
      exportMapScaleBarPanel.style.display = shouldHideScale ? 'none' : 'block';
    }

    function shouldUseMobileRuntimeLayout() {
      const uaDataMobile = Boolean(navigator.userAgentData && navigator.userAgentData.mobile === true);
      const userAgent = navigator.userAgent || '';
      const mobileUa = /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(userAgent);
      const iPadDesktopUa = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const compactViewport = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
      return uaDataMobile || mobileUa || iPadDesktopUa || (hasTouch && compactViewport);
    }

    function enterExportMobileRuntimeLayout() {
      isExportMobileLayoutActive = true;
      moveElementIntoExportMap(exportLayerControlElement);
      moveElementIntoExportMap(exportMapLegendPanel);
      moveElementIntoExportMap(exportMapScaleBarPanel);
      moveElementIntoExportMap(exportMobileControls);
      setExportFabExpanded(false);
      closeExportBottomSheets();
      syncExportMobileActionButtons();
      renderExportScalePanel();
    }

    function exitExportMobileRuntimeLayout() {
      isExportMobileLayoutActive = false;
      isExportScaleTemporarilyHidden = false;
      setExportFabExpanded(false);
      closeExportBottomSheets();
      restoreMovedExportElements();
      renderExportScalePanel();
    }

    function applyRuntimeExportLayout() {
      const useMobileLayout = shouldUseMobileRuntimeLayout();
      document.body.classList.toggle('is-mobile-runtime', useMobileLayout);

      if (useMobileLayout && !isExportMobileLayoutActive) {
        enterExportMobileRuntimeLayout();
      } else if (!useMobileLayout && isExportMobileLayoutActive) {
        exitExportMobileRuntimeLayout();
      } else {
        syncExportMobileActionButtons();
        renderExportScalePanel();
      }

      if (map && typeof map.resize === 'function') {
        map.resize();
      }
    }

    window.addEventListener('resize', applyRuntimeExportLayout);

    if (exportMobileFab) {
      exportMobileFab.addEventListener('click', () => {
        const expanded = exportMobileFab.getAttribute('aria-expanded') === 'true';
        setExportFabExpanded(!expanded);
        if (expanded) {
          closeExportBottomSheets();
        }
      });
    }

    if (exportToggleLayersBtn) {
      exportToggleLayersBtn.addEventListener('click', () => {
        const isOpen = exportLayerControlElement.classList.contains('is-open');
        if (!isOpen) {
          setExportLegendSheetOpen(false);
        }
        setExportLayerSheetOpen(!isOpen);
      });
    }

    if (exportToggleLegendBtn) {
      exportToggleLegendBtn.addEventListener('click', () => {
        if (!exportShowLegend) {
          return;
        }

        const isOpen = exportMapLegendPanel.classList.contains('is-open');
        if (!isOpen) {
          setExportLayerSheetOpen(false);
        }
        setExportLegendSheetOpen(!isOpen);
      });
    }

    if (exportToggleScaleBtn) {
      exportToggleScaleBtn.addEventListener('click', () => {
        if (!exportShowScale) {
          return;
        }

        isExportScaleTemporarilyHidden = !isExportScaleTemporarilyHidden;
        renderExportScalePanel();
      });
    }

    document.addEventListener('click', (event) => {
      if (!isExportMobileLayoutActive) {
        return;
      }

      const eventTarget = event.target;
      if (!(eventTarget instanceof Node)) {
        return;
      }

      const clickInsideControls = exportMobileControls && exportMobileControls.contains(eventTarget);
      if (clickInsideControls) {
        return;
      }

      setExportFabExpanded(false);

      const clickInsideLayerSheet = exportLayerControlElement && exportLayerControlElement.contains(eventTarget);
      const clickInsideLegendSheet = exportMapLegendPanel && exportMapLegendPanel.contains(eventTarget);
      if (clickInsideLayerSheet || clickInsideLegendSheet) {
        return;
      }

      closeExportBottomSheets();
    });

    function haversineDistanceKm(start, end) {
      const toRadians = (value) => value * (Math.PI / 180);
      const earthRadiusKm = 6371;
      const dLat = toRadians(end[1] - start[1]);
      const dLon = toRadians(end[0] - start[0]);
      const lat1 = toRadians(start[1]);
      const lat2 = toRadians(end[1]);

      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;

      return 2 * earthRadiusKm * Math.asin(Math.sqrt(a));
    }

    function getRulerDistanceKm() {
      if (rulerPoints.length < 2) {
        return 0;
      }

      let total = 0;
      for (let index = 1; index < rulerPoints.length; index += 1) {
        total += haversineDistanceKm(rulerPoints[index - 1], rulerPoints[index]);
      }
      return total;
    }

    function formatDistanceLabel(distanceKm) {
      if (distanceKm < 1) {
        return Math.round(distanceKm * 1000) + ' m';
      }
      return distanceKm.toFixed(2) + ' km';
    }

    function getRulerFeatureCollection() {
      const pointFeatures = rulerPoints.map((coordinates) => ({
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates
        },
        properties: {}
      }));

      const features = [...pointFeatures];

      if (rulerPoints.length >= 2) {
        features.unshift({
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: [...rulerPoints]
          },
          properties: {}
        });
      }

      return {
        type: 'FeatureCollection',
        features
      };
    }

    function ensureRulerLayers() {
      if (!map.getSource(RULER_SOURCE_ID)) {
        map.addSource(RULER_SOURCE_ID, {
          type: 'geojson',
          data: getRulerFeatureCollection()
        });
      }

      if (!map.getLayer(RULER_LINE_LAYER_ID)) {
        map.addLayer({
          id: RULER_LINE_LAYER_ID,
          type: 'line',
          source: RULER_SOURCE_ID,
          filter: ['==', ['geometry-type'], 'LineString'],
          paint: {
            'line-color': '#000000',
            'line-width': 2,
            'line-dasharray': [2, 2]
          }
        });
      }

      if (!map.getLayer(RULER_POINT_LAYER_ID)) {
        map.addLayer({
          id: RULER_POINT_LAYER_ID,
          type: 'circle',
          source: RULER_SOURCE_ID,
          filter: ['==', ['geometry-type'], 'Point'],
          paint: {
            'circle-radius': 4,
            'circle-color': '#0080ff',
            'circle-stroke-width': 1,
            'circle-stroke-color': '#000000'
          }
        });
      }
    }

    function refreshRulerData() {
      ensureRulerLayers();
      const rulerSource = map.getSource(RULER_SOURCE_ID);
      if (rulerSource) {
        rulerSource.setData(getRulerFeatureCollection());
      }
    }

    function updateRulerMeasurementDisplay() {
      if (!isRulerActive) {
        rulerMeasurementDisplay.style.display = 'none';
        return;
      }

      const totalDistance = getRulerDistanceKm();
      rulerMeasurementDisplay.textContent = 'Measured distance: ' + formatDistanceLabel(totalDistance);
      rulerMeasurementDisplay.style.display = 'block';
    }

    function updateRulerButtonLabel() {
      if (!rulerButton) {
        return;
      }

      rulerButton.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect x="1.32" y="8.44" width="21.36" height="9.54" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linejoin="round"/><path d="M18.55 8.75V11.47M14.46 8.79V11.52M9.98 8.84V11.56M5.49 8.84V11.56" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>';
      rulerButton.title = isRulerActive
        ? 'Ruler active (click map to add points, click again to clear)'
        : 'Ruler';
    }

    function onRulerMapClick(event) {
      rulerPoints.push([event.lngLat.lng, event.lngLat.lat]);
      refreshRulerData();
      updateRulerMeasurementDisplay();
      updateRulerButtonLabel();
    }

    function clearRulerMeasurement() {
      rulerPoints.length = 0;
      refreshRulerData();
    }

    function deactivateRuler() {
      isRulerActive = false;
      map.off('click', onRulerMapClick);
      map.getCanvas().style.cursor = '';
      clearRulerMeasurement();
      updateRulerMeasurementDisplay();
      updateRulerButtonLabel();
    }

    function activateRuler() {
      isRulerActive = true;
      clearRulerMeasurement();
      map.on('click', onRulerMapClick);
      map.getCanvas().style.cursor = 'crosshair';
      updateRulerMeasurementDisplay();
      updateRulerButtonLabel();
    }

    function toggleRuler() {
      if (isRulerActive) {
        deactivateRuler();
        return;
      }

      activateRuler();
    }

    const rulerControlPlugin = {
      onAdd() {
        const container = document.createElement('div');
        container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', 'Toggle ruler control');
        button.addEventListener('click', toggleRuler);

        container.appendChild(button);
        rulerButton = button;
        updateRulerButtonLabel();

        this.container = container;
        this.button = button;

        return container;
      },
      onRemove() {
        if (isRulerActive) {
          deactivateRuler();
        }

        if (this.button) {
          this.button.removeEventListener('click', toggleRuler);
        }

        if (this.container && this.container.parentNode) {
          this.container.parentNode.removeChild(this.container);
        }

        rulerButton = null;
      }
    };

    map.addControl(rulerControlPlugin, 'top-right');

    function getLayerSourceId(savedId) {
      return 'saved-source-' + savedId;
    }

    function getLayerId(savedId, layerType) {
      return 'saved-' + savedId + '-' + layerType;
    }

    function buildCategoryColorExpression(style, defaultColor, categoryColorKey = 'categoryColors') {
      const styleObject = style && typeof style === 'object' ? style : {};
      const fieldName = typeof styleObject.categoryField === 'string' ? styleObject.categoryField.trim() : '';
      const categoryColors = styleObject[categoryColorKey] && typeof styleObject[categoryColorKey] === 'object'
        ? styleObject[categoryColorKey]
        : null;

      if (!fieldName || !categoryColors) {
        return defaultColor;
      }

      const entries = Object.entries(categoryColors).filter(([categoryValue, colorValue]) => {
        return categoryValue !== ''
          && typeof colorValue === 'string'
          && /^#[0-9a-fA-F]{6}$/.test(colorValue);
      });

      if (!entries.length) {
        return defaultColor;
      }

      const expression = ['match', ['to-string', ['coalesce', ['get', fieldName], '']]];
      entries.forEach(([categoryValue, colorValue]) => {
        expression.push(categoryValue, colorValue);
      });
      expression.push(defaultColor);
      return expression;
    }

    function normalizePopupConfig(config) {
      const fields = Array.isArray(config && config.fields)
        ? config.fields.filter((fieldName) => typeof fieldName === 'string' && fieldName.trim() !== '')
        : [];
      const template = config && typeof config.template === 'string' ? config.template : '';

      return {
        fields,
        template
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildPreviewPopupHtml(entry, properties) {
      const popupConfig = normalizePopupConfig(entry.popupConfig);
      const safeProperties = properties && typeof properties === 'object' ? properties : {};
      const templateText = popupConfig.template.trim();

      if (templateText) {
        const resolved = templateText.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (match, fieldName) => {
          const value = safeProperties[fieldName];
          if (value === undefined || value === null || value === '') {
            return '';
          }
          return String(value);
        });

        const lines = resolved
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line.length > 0)
          .map((line) => '<div>' + escapeHtml(line) + '</div>');

        if (lines.length) {
          return lines.join('');
        }
      }

      const rows = popupConfig.fields
        .map((fieldName) => {
          const value = safeProperties[fieldName];
          if (value === undefined || value === null || value === '') {
            return '';
          }
          return '<div><strong>' + escapeHtml(fieldName) + ':</strong> ' + escapeHtml(value) + '</div>';
        })
        .filter((rowHtml) => rowHtml);

      if (!rows.length) {
        return '';
      }

      return rows.join('');
    }

    function parseOrderKey(orderKey) {
      const separatorIndex = orderKey.indexOf(':');
      if (separatorIndex < 0) {
        return { type: '', id: '' };
      }

      return {
        type: orderKey.slice(0, separatorIndex),
        id: orderKey.slice(separatorIndex + 1)
      };
    }

    function getGeojsonFeatures(data) {
      if (!data || !Array.isArray(data.features)) {
        return [];
      }
      return data.features.filter((feature) => feature && feature.geometry && typeof feature.geometry.type === 'string');
    }

    function getGeojsonCategoryValues(data, fieldName) {
      const normalizedField = typeof fieldName === 'string' ? fieldName.trim() : '';
      if (!normalizedField) {
        return [];
      }

      const values = new Set();
      getGeojsonFeatures(data).forEach((feature) => {
        const properties = feature.properties && typeof feature.properties === 'object' ? feature.properties : null;
        if (!properties) {
          return;
        }

        const value = properties[normalizedField];
        if (value === undefined || value === null) {
          return;
        }

        const stringValue = String(value).trim();
        if (stringValue) {
          values.add(stringValue);
        }
      });

      return Array.from(values).sort((left, right) => left.localeCompare(right, undefined, { sensitivity: 'base' }));
    }

    function getLayerSymbolType(data) {
      const geometryTypes = new Set();
      getGeojsonFeatures(data).forEach((feature) => {
        geometryTypes.add(feature.geometry.type);
      });

      if (!geometryTypes.size) {
        return 'polygon';
      }

      const lineTypes = new Set(['LineString', 'MultiLineString']);
      const pointTypes = new Set(['Point', 'MultiPoint']);

      const isLineOnly = Array.from(geometryTypes).every((type) => lineTypes.has(type));
      if (isLineOnly) {
        return 'line';
      }

      const isPointOnly = Array.from(geometryTypes).every((type) => pointTypes.has(type));
      if (isPointOnly) {
        return 'point';
      }

      return 'polygon';
    }

    function createExportLegendCategoryIcons(entry, symbolType, isLineOnlyLayer) {
      const style = entry && entry.style && typeof entry.style === 'object' ? entry.style : {};
      const categoryField = typeof style.categoryField === 'string' ? style.categoryField.trim() : '';
      if (!categoryField) {
        return null;
      }

      const categoryValues = getGeojsonCategoryValues(entry.data, categoryField);
      if (!categoryValues.length) {
        return null;
      }

      const categoryColors = style.categoryColors && typeof style.categoryColors === 'object' ? style.categoryColors : {};
      const categoryBorderColors = style.categoryBorderColors && typeof style.categoryBorderColors === 'object' ? style.categoryBorderColors : {};
      const MAX_CATEGORY_ICONS = 8;
      const categoriesContainer = document.createElement('div');
      categoriesContainer.className = 'map-legend-categories';

      categoryValues.slice(0, MAX_CATEGORY_ICONS).forEach((categoryValue) => {
        const categoryItem = document.createElement('span');
        categoryItem.className = 'map-legend-category';

        const categorySymbol = document.createElement('span');
        categorySymbol.className = 'map-legend-symbol ' + symbolType;
        const categoryFillColor = categoryColors[categoryValue] || style.fillColor || '#3b82f6';
        const categoryStrokeColor = categoryBorderColors[categoryValue] || style.borderColor || '#1f2937';

        if (isLineOnlyLayer) {
          categorySymbol.style.borderTopColor = categoryStrokeColor;
        } else {
          categorySymbol.style.backgroundColor = categoryFillColor;
          categorySymbol.style.borderColor = categoryStrokeColor;
        }

        const categoryName = document.createElement('span');
        categoryName.className = 'map-legend-category-name';
        categoryName.textContent = categoryValue;
        categoryName.title = categoryValue;

        categoryItem.appendChild(categorySymbol);
        categoryItem.appendChild(categoryName);
        categoriesContainer.appendChild(categoryItem);
      });

      if (categoryValues.length > MAX_CATEGORY_ICONS) {
        const moreItem = document.createElement('span');
        moreItem.className = 'map-legend-style';
        moreItem.textContent = '+' + (categoryValues.length - MAX_CATEGORY_ICONS) + ' more';
        categoriesContainer.appendChild(moreItem);
      }

      return categoriesContainer;
    }

    function renderExportLegendPanel() {
      if (!exportMapLegendPanel) {
        return;
      }

      if (!exportShowLegend) {
        exportMapLegendPanel.classList.remove('is-open');
        exportMapLegendPanel.style.display = 'none';
        exportMapLegendPanel.innerHTML = '';
        return;
      }

      const activeEntries = [];
      exportedOrderKeys.forEach((orderKey) => {
        const parsed = parseOrderKey(orderKey);
        if (parsed.type !== 'layer') {
          return;
        }

        const entry = exportedLayersById.get(parsed.id);
        if (!entry || entry.visible === false) {
          return;
        }

        activeEntries.push(entry);
      });

      const title = document.createElement('div');
      title.className = 'map-legend-title';
      title.textContent = 'Legend';

      const list = document.createElement('div');
      list.className = 'map-legend-list';

      if (!activeEntries.length) {
        const emptyItem = document.createElement('div');
        emptyItem.className = 'map-legend-style';
        emptyItem.textContent = 'No active layers in the layer control.';
        list.appendChild(emptyItem);
      } else {
        activeEntries.forEach((entry) => {
          const style = entry && entry.style && typeof entry.style === 'object' ? entry.style : {};
          const categoryField = typeof style.categoryField === 'string' ? style.categoryField.trim() : '';
          const hasCategoryField = Boolean(categoryField);
          const symbolType = getLayerSymbolType(entry.data);
          const isLineOnlyLayer = symbolType === 'line';

          const item = document.createElement('div');
          item.className = 'map-legend-item';

          const row = document.createElement('div');
          row.className = 'map-legend-row';

          const symbol = document.createElement('span');
          symbol.className = 'map-legend-symbol ' + symbolType;
          const fillColor = style.fillColor || '#3b82f6';
          const borderColor = style.borderColor || '#1f2937';
          if (symbolType === 'line') {
            symbol.style.borderTopColor = borderColor;
          } else {
            symbol.style.backgroundColor = fillColor;
            symbol.style.borderColor = borderColor;
          }

          const label = document.createElement('span');
          label.className = 'map-legend-label';
          label.textContent = entry.layerLabel || entry.name || entry.id;
          label.title = label.textContent;

          if (!hasCategoryField) {
            row.appendChild(symbol);
          }
          row.appendChild(label);

          item.appendChild(row);

          const categoryIcons = createExportLegendCategoryIcons(entry, symbolType, isLineOnlyLayer);
          if (categoryIcons) {
            item.appendChild(categoryIcons);
          }

          list.appendChild(item);
        });
      }

      exportMapLegendPanel.innerHTML = '';
      exportMapLegendPanel.appendChild(title);
      exportMapLegendPanel.appendChild(list);
      exportMapLegendPanel.style.display = 'block';
    }

    function setSavedLayerVisibility(savedId, isVisible) {
      const layerIds = [
        getLayerId(savedId, 'polygon-fill'),
        getLayerId(savedId, 'line'),
        getLayerId(savedId, 'polygon-outline'),
        getLayerId(savedId, 'point')
      ];

      layerIds.forEach((layerId) => {
        if (map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, 'visibility', isVisible ? 'visible' : 'none');
        }
      });
    }

    function getExclusiveGroupLayerIdsByLayerId(layerId) {
      const titlesById = new Map(exportedTitles.map((item) => [item.id, item]));
      const layersByGroupId = new Map();
      let currentGroupId = MAIN_TITLE_GROUP_ID;
      let targetGroupId = null;

      exportedOrderKeys.forEach((orderKey) => {
        const parsed = parseOrderKey(orderKey);
        if (parsed.type === 'title') {
          currentGroupId = parsed.id;
          return;
        }

        if (parsed.type !== 'layer') {
          return;
        }

        if (parsed.id === layerId) {
          targetGroupId = currentGroupId;
        }

        if (!layersByGroupId.has(currentGroupId)) {
          layersByGroupId.set(currentGroupId, []);
        }

        layersByGroupId.get(currentGroupId).push(parsed.id);
      });

      if (!targetGroupId) {
        return [];
      }

      const isExclusiveGroup = targetGroupId === MAIN_TITLE_GROUP_ID
        ? exportMainTitleExclusive
        : Boolean(titlesById.get(targetGroupId) && titlesById.get(targetGroupId).exclusive);

      if (!isExclusiveGroup) {
        return [];
      }

      return layersByGroupId.get(targetGroupId) || [];
    }

    function refreshExportLayerControl() {
      const titlesById = new Map(exportedTitles.map((item) => [item.id, item]));
      let currentGroupId = MAIN_TITLE_GROUP_ID;

      exportLayerControlTitle.textContent = exportMainTitle;
      exportLayerList.innerHTML = '';

      if (!exportedLayers.length) {
        const empty = document.createElement('div');
        empty.textContent = 'No visible layers exported.';
        exportLayerList.appendChild(empty);
        renderExportLegendPanel();
        return;
      }

      exportedOrderKeys.forEach((orderKey) => {
        const parsed = parseOrderKey(orderKey);

        if (parsed.type === 'title') {
          const titleItem = titlesById.get(parsed.id);
          if (!titleItem) {
            return;
          }

          currentGroupId = titleItem.id;
          const titleRow = document.createElement('div');
          titleRow.className = 'export-layer-title-item';
          titleRow.textContent = titleItem.label;
          exportLayerList.appendChild(titleRow);
          return;
        }

        if (parsed.type !== 'layer') {
          return;
        }

        const entry = exportedLayersById.get(parsed.id);
        if (!entry) {
          return;
        }

        const row = document.createElement('label');
        row.className = 'export-layer-item';

        const groupIsExclusive = currentGroupId === MAIN_TITLE_GROUP_ID
          ? exportMainTitleExclusive
          : Boolean(titlesById.get(currentGroupId) && titlesById.get(currentGroupId).exclusive);

        const visibilityInput = document.createElement('input');
        visibilityInput.type = groupIsExclusive ? 'radio' : 'checkbox';
        if (groupIsExclusive) {
          visibilityInput.name = 'exclusive-group-' + currentGroupId;
        }

        visibilityInput.checked = entry.visible !== false;
        visibilityInput.addEventListener('change', () => {
          if (visibilityInput.checked) {
            entry.visible = true;

            const exclusiveGroupLayerIds = getExclusiveGroupLayerIdsByLayerId(entry.id);
            exclusiveGroupLayerIds.forEach((layerId) => {
              if (layerId === entry.id) {
                return;
              }

              const otherEntry = exportedLayersById.get(layerId);
              if (otherEntry) {
                otherEntry.visible = false;
                setSavedLayerVisibility(otherEntry.id, false);
              }
            });
          } else {
            entry.visible = false;
          }

          setSavedLayerVisibility(entry.id, entry.visible !== false);
          refreshExportLayerControl();
        });

        const name = document.createElement('span');
        name.textContent = entry.layerLabel || entry.name || entry.id;
        name.title = name.textContent;

        row.appendChild(visibilityInput);
        row.appendChild(name);
        exportLayerList.appendChild(row);
      });

      renderExportLegendPanel();
    }

    function rebuildExportLayersForCurrentStyle() {
      interactiveLayerIds.length = 0;
      layerEntryByLayerId.clear();

      exportedLayers.forEach((entry) => {
        const sourceId = getLayerSourceId(entry.id);
        const polygonFillLayerId = getLayerId(entry.id, 'polygon-fill');
        const lineLayerId = getLayerId(entry.id, 'line');
        const polygonOutlineLayerId = getLayerId(entry.id, 'polygon-outline');
        const pointLayerId = getLayerId(entry.id, 'point');

        entry.popupConfig = normalizePopupConfig(entry.popupConfig);

        if (map.getLayer(pointLayerId)) {
          map.removeLayer(pointLayerId);
        }
        if (map.getLayer(lineLayerId)) {
          map.removeLayer(lineLayerId);
        }
        if (map.getLayer(polygonOutlineLayerId)) {
          map.removeLayer(polygonOutlineLayerId);
        }
        if (map.getLayer(polygonFillLayerId)) {
          map.removeLayer(polygonFillLayerId);
        }
        if (map.getSource(sourceId)) {
          map.removeSource(sourceId);
        }

        map.addSource(sourceId, {
          type: 'geojson',
          data: entry.data
        });

        map.addLayer({
          id: polygonFillLayerId,
          type: 'fill',
          source: sourceId,
          filter: ['any', ['==', ['geometry-type'], 'Polygon'], ['==', ['geometry-type'], 'MultiPolygon']],
          paint: {
            'fill-color': buildCategoryColorExpression(entry.style, entry.style.fillColor, 'categoryColors'),
            'fill-opacity': 0.4
          }
        });

        map.addLayer({
          id: lineLayerId,
          type: 'line',
          source: sourceId,
          filter: ['any', ['==', ['geometry-type'], 'LineString'], ['==', ['geometry-type'], 'MultiLineString']],
          paint: {
            'line-color': buildCategoryColorExpression(entry.style, entry.style.borderColor, 'categoryBorderColors'),
            'line-width': 3
          }
        });

        map.addLayer({
          id: polygonOutlineLayerId,
          type: 'line',
          source: sourceId,
          filter: ['any', ['==', ['geometry-type'], 'Polygon'], ['==', ['geometry-type'], 'MultiPolygon']],
          paint: {
            'line-color': buildCategoryColorExpression(entry.style, entry.style.borderColor, 'categoryBorderColors'),
            'line-width': 2
          }
        });

        map.addLayer({
          id: pointLayerId,
          type: 'circle',
          source: sourceId,
          filter: ['any', ['==', ['geometry-type'], 'Point'], ['==', ['geometry-type'], 'MultiPoint']],
          paint: {
            'circle-radius': 6,
            'circle-color': buildCategoryColorExpression(entry.style, entry.style.fillColor, 'categoryColors'),
            'circle-stroke-width': 1,
            'circle-stroke-color': buildCategoryColorExpression(entry.style, entry.style.borderColor, 'categoryBorderColors')
          }
        });

        setSavedLayerVisibility(entry.id, entry.visible !== false);
        const layerIdsForPopup = [polygonFillLayerId, lineLayerId, polygonOutlineLayerId, pointLayerId];
        layerIdsForPopup.forEach((layerId) => {
          interactiveLayerIds.push(layerId);
          layerEntryByLayerId.set(layerId, entry);
        });
      });

      if (!exportMapClickHandlerBound) {
        exportMapClickHandlerBound = true;
        map.on('click', (event) => {
          const clickedFeatures = map.queryRenderedFeatures(event.point, { layers: interactiveLayerIds });
          if (!clickedFeatures.length) {
            if (exportFeaturePopup) {
              exportFeaturePopup.remove();
              exportFeaturePopup = null;
            }
            return;
          }

          const clickedFeature = clickedFeatures[0];
          const clickedLayerId = clickedFeature.layer && clickedFeature.layer.id ? clickedFeature.layer.id : '';
          const entry = layerEntryByLayerId.get(clickedLayerId);
          if (!entry || entry.visible === false) {
            return;
          }

          const popupHtml = buildPreviewPopupHtml(entry, clickedFeature.properties || {});
          if (!popupHtml) {
            if (exportFeaturePopup) {
              exportFeaturePopup.remove();
              exportFeaturePopup = null;
            }
            return;
          }

          if (exportFeaturePopup) {
            exportFeaturePopup.remove();
          }

          exportFeaturePopup = new maplibregl.Popup({ closeOnClick: true, offset: 10 })
            .setLngLat(event.lngLat)
            .setHTML(popupHtml)
            .addTo(map);
        });
      }

      refreshExportLayerControl();
      applyRuntimeExportLayout();
    }

    map.on('style.load', () => {
      hasExportStyleLoaded = true;
      rebuildExportLayersForCurrentStyle();
    });
  </script>
